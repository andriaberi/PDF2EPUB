name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Check
        run: make check PYTHON=python

  dco:
    # Every commit in a pull request certifies the DCO (docs/CONTRIBUTING.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        run: |
          missing=0
          for c in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git show -s --format='%h %s' "$c") is not signed off: see docs/CONTRIBUTING.md"
              missing=1
            fi
          done
          exit $missing

  # Each push to main that passes the checks is released, its version bumped by the commits
  # since the last tag: "feat!:" or a "BREAKING CHANGE:" line bumps major, "feat:" minor,
  # anything else patch; only docs/chore/ci/test/refactor/style/build commits release nothing.
  # With no tag yet, the release is 1.0.0.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Number the release
        id: number
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "This commit is released already."
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$previous" ]; then
            version=1.0.0
          else
            subjects=$(git log --format=%s "$previous..HEAD")
            if git log --format=%s%n%b "$previous..HEAD" | grep -qE '^[a-z]+(\(.*\))?!:|^BREAKING[ -]CHANGE:'; then
              bump=major
            elif grep -qE '^feat(\(.*\))?:' <<< "$subjects"; then
              bump=minor
            elif grep -qvE '^(docs|chore|ci|test|refactor|style|build)(\(.*\))?:' <<< "$subjects"; then
              bump=patch
            else
              echo "Only docs, chores and the like since $previous: nothing to release."
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${previous#v}"
            case $bump in
              major) version=$((major + 1)).0.0 ;;
              minor) version=$major.$((minor + 1)).0 ;;
              patch) version=$major.$minor.$((patch + 1)) ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.number.outputs.version
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.number.outputs.version }}
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Release
        if: steps.number.outputs.version
        env:
          VERSION: ${{ steps.number.outputs.version }}
          PREVIOUS: ${{ steps.number.outputs.previous }}
        run: |
          if [ -n "$PREVIOUS" ]; then
            git log --format='- %s' "$PREVIOUS..HEAD" > notes.md
          else
            echo "- The first release." > notes.md
          fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
