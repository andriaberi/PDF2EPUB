[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub"
version = "0"
description = "A fast, clean Python tool for converting PDF books into well-structured, reflowable EPUBs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andria Beridze" }]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

# Build

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdf2epub.epub" = ["fonts/*.ttf", "fonts/OFL.txt"]

# Ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "PTH",     # use pathlib
    "RUF",     # ruff-specific
]

# Books are multilingual: en dashes, Cyrillic and Greek letters in strings are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# Mypy

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
strict = true
warn_unreachable = true
# PyMuPDF ships type hints for only part of its API.
untyped_calls_exclude = ["pymupdf"]
pretty = true

# Pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
